<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#061820"><meta name="description" content="Keep a city's lights on through a 12-hour shift. Plan your power stations, react to storms and breakdowns, and get graded against perfect hindsight."><title>Grid Shift</title><link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20fill%3D%22%230b2530%22%2F%3E%3Cpath%20d%3D%22M18%203%206%2019h9l-2%2010L27%2012h-10z%22%20fill%3D%22%23fbbf24%22%2F%3E%3C%2Fsvg%3E%0A" type="image/svg+xml"><style>
/* Grid Shift — command deck. Dark-only by design. */
:root {
  color-scheme: dark;
  --bg: #061820; --panel: #0c2934; --panel2: #123744; --line: #2d5461; --ink: #ecf5f2; --muted: #a6bfbd;
  --yellow: #fbbf24; --cyan: #5eead4; --red: #fb7185; --purple: #b9a1ff; --orange: #fb923c; --amber: #fcd34d;
  --shadow: 4px 4px 0 #031014;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  background-image: linear-gradient(#5eead406 1px, transparent 1px), linear-gradient(90deg, #5eead406 1px, transparent 1px);
  background-size: 24px 24px;
}
button, input, select, textarea { font: inherit; }
button, a, input { -webkit-tap-highlight-color: transparent; }
button {
  cursor: pointer; background: #173b48; color: var(--ink); border: 1px solid #527580; border-radius: 4px;
  padding: 10px 14px; min-height: 42px; font-size: 13px; font-weight: 600; transition: background .15s, border-color .15s;
}
button:hover { border-color: var(--cyan); background: #1b4753; }
button:active { transform: translateY(1px); }
button:disabled { opacity: .4; cursor: default; }
button.primary { background: var(--yellow); color: #09232c; border: 2px solid #ffe399; box-shadow: 3px 3px 0 #031014; font-weight: 800; }
button.primary:hover { background: #ffd45d; border-color: #fff0b9; }
.quiet { background: transparent; border-color: var(--line); }
.text-button { background: none; border: 0; padding: 5px 7px; min-height: 32px; color: var(--muted); }
.text-button:hover { background: none; color: var(--ink); }
button:focus-visible, input:focus-visible, summary:focus-visible, a:focus-visible, [data-chart-hour]:focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
input, textarea { color: var(--ink); background: #071d26; border: 1px solid #527580; border-radius: 4px; padding: 11px; width: 100%; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--mono); }
h2 { font-size: 26px; line-height: 1.2; letter-spacing: -.04em; }
h3 { font-size: 15px; }
.muted { color: var(--muted); }
.good { color: var(--cyan); }
.bad { color: var(--red); }
.yellow { color: var(--yellow); }
.purple { color: #c4b5fd; }
.eyebrow { font: 10px/1.4 var(--mono); letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.skip { position: absolute; left: -999px; top: 8px; background: var(--yellow); color: #08232d; padding: 8px 12px; z-index: 30; }
.skip:focus { left: 8px; }

/* ---------- Shell ---------- */
.shell { width: min(1200px, 100%); margin: auto; padding: 14px 18px 0; }
.topbar {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 9px 13px;
  background: var(--panel); border: 2px solid var(--line); box-shadow: var(--shadow);
}
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; min-height: 0; }
.brand:hover { background: none; }
.brand-mark { width: 34px; height: 36px; background: var(--yellow); color: #08232d; display: grid; place-items: center; border: 2px solid #fff1be; font: 900 29px var(--mono); }
h1 { font-size: 21px; letter-spacing: .1em; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.tour-trigger { color: var(--yellow); border-color: #8c783b; background: #fbbf2408; }
.steps { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 2px; font: 11px var(--mono); color: #6e9494; flex-wrap: wrap; }
.stages { display: flex; gap: 25px; }
.stage.active { color: var(--yellow); }
.stage.done { color: var(--cyan); }
.stage b { font-weight: 400; margin-right: 6px; }
.shift-label { color: var(--muted); }
.page-title { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 6px 0 14px; }
.page-title p { color: var(--muted); font-size: 14px; margin-top: 6px; max-width: 70ch; }
.page-title .goal { color: var(--yellow); font: 12px var(--mono); }
.page-title h2 small { font: 11px var(--mono); color: var(--muted); letter-spacing: .08em; margin-left: 8px; }
.footer { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 18px 2px 14px; font-size: 11px; color: var(--muted); }
.panel { background: var(--panel); border: 2px solid var(--line); box-shadow: var(--shadow); border-radius: 3px; min-width: 0; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.panel-head h3 { font-size: 15px; }
.tag { font: 10px var(--mono); color: var(--muted); border: 1px solid #41636c; padding: 5px 7px; border-radius: 3px; white-space: nowrap; }
.stars { display: inline-flex; gap: 1px; color: #3b5a63; letter-spacing: 0; }
.stars i { font-style: normal; }
.stars i.lit { color: var(--yellow); text-shadow: 0 0 8px #fbbf2466; }

/* ---------- Home ---------- */
.hero { padding: 26px 2px 18px; max-width: 760px; }
.hero h2 { font-size: clamp(28px, 4.4vw, 42px); margin: 8px 0 10px; }
.hero p { color: var(--muted); font-size: 16px; }
.resume { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 14px 18px; margin-bottom: 14px; border-color: #8c783b; }
.resume h3 { margin: 4px 0 3px; }
.resume p { font-size: 12px; color: var(--muted); }
.mode-grid { display: grid; grid-template-columns: 1.3fr 1fr 1fr; gap: 14px; }
.mode-card { display: flex; flex-direction: column; gap: 10px; padding: 18px; background: var(--panel); border: 2px solid var(--line); box-shadow: var(--shadow); border-radius: 3px; min-width: 0; }
.mode-card h3 { font-size: 18px; }
.mode-card p { color: var(--muted); font-size: 13px; }
.mode-card > button, .mode-card form { margin-top: auto; }
.mode-card.campaign { border-color: #8c783b; background: linear-gradient(180deg, #2a2c1f, var(--panel) 55%); }
.code-line { font: 12px var(--mono); color: var(--ink) !important; }
.track { list-style: none; padding: 0; margin: 4px 0; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 5px; }
.track-day { width: 100%; min-height: 50px; padding: 5px 2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: 12px var(--mono); background: #0a222c; }
.track-day .stars { font-size: 8px; }
.track-day .open { font-size: 8px; color: var(--cyan); }
.track-day .lock { font-size: 10px; opacity: .6; }
.track-day.done { border-color: #398a7b; }
.track-day.next { border: 2px solid var(--yellow); }
.seed-form label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
.seed-row { display: flex; gap: 8px; }
.seed-row input { font-family: var(--mono); text-transform: uppercase; }
.seed-row button { white-space: nowrap; }
.opponent-picker { margin-top: 18px; }
.segmented { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; padding: 5px; background: #0a222c; border: 1px solid var(--line); border-radius: 5px; }
.segmented button { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; background: transparent; border-color: transparent; }
.segmented button small { font-weight: 400; font-size: 11px; color: var(--muted); }
.segmented button[aria-checked=true] { background: #4a3d22; border-color: #b89940; color: var(--yellow); }

/* ---------- Warnings ---------- */
.warning-strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 13px; }
.warning-chip { display: inline-flex; align-items: center; gap: 8px; padding: 6px 10px; border: 1px solid #80713f; background: #2c2b20; border-radius: 3px; font-size: 12px; }
.warning-chip b { font: 700 12px var(--mono); }
.warning-chip span { color: #d9cfa6; font: 11px var(--mono); }
.warning-chip.confirmed, .warning-chip.active { border-color: #a65060; background: #3b2833; }
.warning-chip.confirmed span, .warning-chip.active span { color: #fecdd3; }
.warning-chip.cleared, .warning-chip.over { opacity: .55; border-color: var(--line); background: transparent; }
.warning-chip.calm { border-color: #357266; background: #103740; color: var(--cyan); font: 12px var(--mono); }
.warning-list { padding-left: 18px; margin: 0 0 14px; color: var(--muted); font-size: 13px; }
.warning-list li { margin-bottom: 8px; }
.warning-list b { color: var(--ink); }

/* ---------- Plan ---------- */
.strategy-row { display: flex; align-items: center; gap: 14px; margin-bottom: 13px; }
.strategy-row > .eyebrow { font-size: 9px; width: 70px; line-height: 1.6; }
.presets { flex: 1; display: flex; gap: 4px; padding: 4px; background: #0a222c; border: 1px solid var(--line); border-radius: 5px; }
.presets button { flex: 1; min-height: 38px; padding: 7px 12px; background: transparent; border: 1px solid transparent; color: var(--muted); }
.presets button small { font: 9px var(--mono); margin-left: 6px; opacity: .75; }
.presets button[aria-pressed=true] { color: var(--yellow); background: #4a3d22; border-color: #b89940; }

/* ---------- Command view ---------- */
.command-view { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 14px; align-items: stretch; }
.dispatch-panel { padding: 14px 16px 0; }
.chart-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.chart-heading h3 { font-size: 15px; }
.line-legend { display: flex; gap: 14px; font-size: 10px; color: var(--muted); flex-wrap: wrap; }
.line-legend span::before { content: ''; display: inline-block; width: 17px; border-top: 2px solid var(--color, var(--yellow)); margin-right: 5px; vertical-align: middle; }
.line-legend span.dashed::before { border-top-style: dashed; }
.line-legend .band-key::before { height: 9px; border: 0; background: #fbbf2426; outline: 1px solid #fbbf2455; }
.timeline-wrap { margin-top: 6px; }
.timeline-chart { display: block; width: 100%; height: auto; overflow: visible; }
.gridline { stroke: #31515d; stroke-width: 1; stroke-dasharray: 2 5; }
.axis { fill: #a5bfbd; font: 11px var(--mono); }
.hour-axis { font: 12px var(--mono); fill: #edf8f2; }
.hour-axis.future { fill: #92adac; }
.hour-axis.selected { fill: var(--yellow); }
.selected-mark { stroke: var(--yellow); stroke-width: 3; }
.current-band { fill: #fbbf2413; stroke: #fbbf2466; stroke-width: 1; }
.need-band { fill: #fbbf241f; stroke: #fbbf2433; stroke-width: 1; pointer-events: none; }
.forecast-line { fill: none; stroke: var(--yellow); stroke-width: 2; stroke-dasharray: 5 5; pointer-events: none; }
.actual-line { fill: none; stroke: white; stroke-width: 3; pointer-events: none; }
.chart-column { cursor: pointer; outline: none; }
.chart-column:hover, .chart-column:focus-visible { filter: brightness(1.25); }
.chart-column:focus-visible .hitbox { stroke: var(--yellow); stroke-width: 2; }
.chart-column.future-column > rect:not(.hitbox):not(.need-band) { opacity: .6; }
.spare-outline { fill: #5eead409; stroke: #81b7b2; stroke-width: 1; stroke-dasharray: 3 3; }
.trip-mark { fill: var(--red); font: 12px var(--mono); }
.event-marker rect { fill: #fbbf2422; stroke: #fbbf2488; stroke-width: 1; }
.event-marker.confirmed rect, .event-marker.active rect { fill: #fb718530; stroke: var(--red); }
.event-marker text { fill: #fde68a; font: 10px var(--mono); }
.event-marker.confirmed text, .event-marker.active text { fill: #fecdd3; }
.chart-legend { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; font: 10px var(--mono); color: #b3cac6; padding: 8px 0 10px; }
.chart-legend span::before { content: ''; width: 8px; height: 8px; background: var(--color); display: inline-block; margin-right: 5px; }
.chart-legend .spare-key::before { border: 1px dashed #81b7b2; background: transparent; }
.chart-legend .gap-key::before { background: repeating-linear-gradient(135deg, #fb7185, #fb7185 2px, #783545 2px, #783545 4px); }
.chart-readout { display: flex; align-items: center; justify-content: space-between; gap: 8px 14px; padding: 10px 0; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); flex-wrap: wrap; }
.chart-readout > b { font: 700 14px var(--mono); color: var(--ink); }
.chart-readout b small { font: 8px var(--mono); color: var(--muted); display: block; margin-top: 3px; }
.chart-readout > span strong { font: 700 15px var(--mono); color: var(--ink); }
.chart-readout .good strong { color: var(--cyan); }
.chart-readout .bad strong { color: var(--red); }
.chart-caption { display: flex; justify-content: space-between; align-items: center; gap: 7px; font-size: 10px; color: #9ab7b5; min-height: 26px; padding-bottom: 6px; flex-wrap: wrap; }
.chart-caption .text-button { font-size: 11px; min-height: 22px; padding: 0; color: var(--yellow); }

.grid-status { padding: 16px 17px; display: flex; flex-direction: column; justify-content: space-between; background: linear-gradient(180deg, #103540, #08232d); }
.grid-status.grid-alert { border-color: #a65060; }
.status-heading .eyebrow { font-size: 8px; letter-spacing: .06em; display: block; }
.status-heading > b { font: 700 20px var(--mono); display: block; margin-top: 8px; letter-spacing: .09em; }
.city { width: 100%; display: block; max-height: 118px; margin: 14px 0 4px; }
.city .block { fill: #0a2630; stroke: #46626a; }
.city .city-window { fill: #f5d781; transition: fill .5s, opacity .5s; }
.city.brownout .city-window { fill: #b4893a; animation: flicker 1.6s steps(2) infinite; }
.city .building.dark .city-window { fill: #1a333b; animation: none; }
.city .building.dark .block { fill: #061820; }
.city .cross { fill: var(--red); }
.city .backup { fill: var(--red); font: 700 7px var(--mono); animation: blink 1.2s ease-in-out infinite; }
.city.blackout .hospital .city-window { fill: #fda4af; }
.city-wire { stroke: var(--cyan); stroke-width: 1.5; fill: none; stroke-dasharray: 3 4; }
.grid-alert .city-wire { stroke: var(--red); }
.power-pulse { fill: var(--cyan); animation: flow 3s linear infinite; }
.power-pulse.second { animation-delay: -1.5s; }
.city.blackout .power-pulse, .city.brownout .power-pulse.second { display: none; }
.live-balance { padding: 4px 0 12px; display: flex; flex-direction: column; gap: 5px; }
.live-balance strong { font: 700 28px var(--mono); }
.live-balance strong small { font: 11px var(--mono); color: var(--muted); }
.live-balance > span { font-size: 11px; color: var(--cyan); }
.grid-alert .live-balance > span { color: var(--red); }
.status-bottom { display: flex; justify-content: space-between; gap: 9px; border-top: 1px solid var(--line); padding-top: 11px; font-size: 10px; color: var(--muted); }
.status-bottom span { display: flex; flex-direction: column; gap: 4px; }
.status-bottom b { color: var(--ink); font: 700 15px var(--mono); }
.status-bottom b.bad { color: var(--red); }
.status-bottom b.good { color: var(--cyan); }

/* ---------- Units ---------- */
.units { margin-top: 13px; }
.units.collapsed .panel-head { border-bottom: 0; }
.unit-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; padding: 10px; }
.unit {
  display: flex; flex-direction: column; align-items: stretch; gap: 6px; text-align: left; padding: 9px 10px; min-height: 92px;
  background: #0b2630; border: 1px solid var(--line); border-left: 4px solid #2d4a52; font-weight: 400;
}
.unit.on { background: #13343f; border-color: #4f7a82; border-left-color: var(--unit); }
.unit.locked { background-image: repeating-linear-gradient(135deg, transparent, transparent 6px, #ffffff06 6px, #ffffff06 12px); }
.unit.tripped { border-color: var(--red); border-left-color: var(--red); }
.unit.changed { box-shadow: inset 0 0 0 1px var(--yellow); }
.unit-top { display: flex; align-items: center; gap: 7px; }
.unit-top svg { width: 24px; height: 22px; fill: none; stroke: var(--unit); stroke-width: 2; flex-shrink: 0; opacity: .5; }
.unit.on .unit-top svg { opacity: 1; }
.unit-name { display: flex; flex-direction: column; font-size: 10px; color: var(--muted); line-height: 1.2; }
.unit-name b { font: 700 14px var(--mono); color: var(--ink); }
.unit-state { margin-left: auto; font: 700 10px var(--mono); padding: 2px 5px; border-radius: 2px; background: #22414a; color: var(--muted); }
.unit.on .unit-state { background: var(--unit); color: #08232d; }
.unit.tripped .unit-state { background: var(--red); color: #08232d; }
.unit-power { font-size: 11px; color: var(--muted); }
.unit-power b { font: 700 13px var(--mono); color: var(--ink); }
.unit-note { font-size: 10px; color: #9ab7b5; line-height: 1.3; }
.unit.changed .unit-note { color: var(--yellow); }
.unit.tripped .unit-note { color: var(--red); }
.auto-note { font-size: 11px; color: var(--muted); padding: 0 12px 11px; }

/* ---------- Play ---------- */
.shift-meters { display: flex; gap: 20px; text-align: right; }
.shift-meters div { display: flex; flex-direction: column; gap: 3px; }
.shift-meters small { font: 9px var(--mono); letter-spacing: .12em; color: var(--muted); }
.shift-meters b { font: 700 22px var(--mono); color: var(--yellow); }
.shift-meters b span { font-size: 12px; color: var(--muted); }
.shift-meters b.bad { color: var(--red); }
.event-banner { display: flex; align-items: center; gap: 12px; background: #103740; border: 1px solid #357266; border-left: 4px solid var(--cyan); padding: 10px 13px; margin-bottom: 11px; min-height: 59px; }
.event-banner.danger { border-color: #a65060; border-left-color: var(--red); background: #3b2833; }
.event-banner.weather { border-color: #80713f; border-left-color: var(--yellow); background: #343327; }
.event-symbol { font: 700 27px var(--mono); color: var(--cyan); width: 30px; flex-shrink: 0; text-align: center; }
.danger .event-symbol { color: var(--red); }
.weather .event-symbol { color: var(--yellow); }
.event-banner > div { display: flex; flex-direction: column; gap: 4px; }
.event-banner b { font: 700 13px var(--mono); }
.event-banner div > span { font-size: 12px; color: #c3d6d1; }
.run-state { margin-left: auto; flex-shrink: 0; font: 10px var(--mono); color: var(--muted); letter-spacing: .06em; }
.run-state i { display: inline-block; width: 6px; height: 6px; background: var(--cyan); border-radius: 50%; margin-right: 5px; animation: blink 2s ease-in-out infinite; }
.options { margin-top: 13px; }
.options-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
.options-head span { font-size: 11px; color: var(--muted); }
.option-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.option { display: flex; align-items: center; gap: 12px; text-align: left; padding: 11px 13px; background: #12333e; border: 1px solid #55777a; min-height: 78px; font-weight: 400; }
.option[aria-pressed=true] { background: #0b2630; border-style: dashed; cursor: default; }
.option-icon { font: 22px var(--mono); color: var(--cyan); flex-shrink: 0; width: 22px; text-align: center; }
.option.coal .option-icon { color: var(--coal, #b2c4d2); }
.option.gas .option-icon { color: var(--orange); }
.option-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.option-body b { font: 700 13px var(--mono); }
.option-body small { font-size: 11px; color: #aac6c1; }
.option-costs { margin-left: auto; display: flex; flex-direction: column; gap: 4px; text-align: right; }
.option-costs em { font: 700 12px var(--mono); font-style: normal; white-space: nowrap; }
.option-costs em small { display: block; font: 9px var(--mono); color: var(--muted); font-weight: 400; }
.option-costs em.good { color: var(--cyan); }
.option-costs em.bad { color: var(--red); }
.option.urgent { background: #4b3925; border: 2px solid var(--yellow); }
.decision-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); padding: 4px 2px 0; flex-wrap: wrap; }
.decision-meta .text-button { font-size: 11px; }
.action-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 18px; margin: 13px 0 0; padding: 11px 15px;
  background: #10313c; border: 2px solid #42646e; box-shadow: var(--shadow); position: sticky; bottom: 10px; z-index: 5; border-radius: 4px;
}
.action-summary { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.action-summary strong { font: 700 21px var(--mono); }
.action-summary strong small { font: 11px system-ui; color: var(--muted); }
.action-summary > span, .action-summary .text-button { font-size: 11px; color: var(--muted); padding: 0; min-height: 0; text-align: left; }
.transport { display: flex; gap: 9px; flex-wrap: wrap; justify-content: flex-end; }
.transport .primary { min-width: 170px; min-height: 48px; }
.transport .pause-button { background: var(--cyan); border-color: #a5f5e5; }

/* ---------- Results ---------- */
.result-hero { display: flex; align-items: center; gap: 26px; padding: 22px 24px; border-color: #8c783b; background: linear-gradient(120deg, #2a2c1f, var(--panel) 60%); }

const __config_mjs = (() => {

/** Grid Shift tuning. Every gameplay number lives here so balance changes are one-file edits.

const VERSION = 3;
const HOURS = 12;
const START_HOUR = 8;
const WIND_CAPACITY = 280;
const SOLAR_CAPACITY = 300;

/** `lead` is the notice (hours) a change needs during the shift; null means fixed for the whole shift. */
const FLEET = Object.freeze([
  {id: 'N1', name: 'Northbank', type: 'Nuclear', capacity: 240, rate: 14, fixed: 1000, startup: 10000, change: 1200, co2: 0.012, lead: null},
  {id: 'C1', name: 'Ironbridge', type: 'Coal', capacity: 180, rate: 34, fixed: 550, startup: 4500, change: 320, co2: 0.92, lead: 2},
  {id: 'C2', name: 'Moorfield', type: 'Coal', capacity: 140, rate: 39, fixed: 420, startup: 3400, change: 260, co2: 0.96, lead: 1},
  {id: 'G1', name: 'Riverside', type: 'Gas', capacity: 180, rate: 67, fixed: 500, startup: 1000, change: 160, co2: 0.36, lead: 0},
  {id: 'G2', name: 'Eastgate', type: 'Gas', capacity: 120, rate: 90, fixed: 350, startup: 600, change: 120, co2: 0.43, lead: 0},
  {id: 'G3', name: 'Hilltop', type: 'Gas', capacity: 90, rate: 125, fixed: 250, startup: 350, change: 90, co2: 0.49, lead: 0},
].map(Object.freeze));

/** Unmet demand up to `brownoutShare` of the hour's demand is a brownout; the rest is a blackout. */
const SHORTAGE = Object.freeze({brownoutShare: 0.03, brownoutPrice: 300, blackoutPrice: 2500});

/** Rules a campaign day can change. errorScale multiplies all forecast errors; demandScale sizes demand to the fleet. */
const DEFAULT_RULES = Object.freeze({disabled: 0, leadTimes: true, wind: true, solar: true, errorScale: 1.3, demandScale: 1});

/** Weather alerts (MW versus forecast) that pause a running shift. */
const ALERTS = Object.freeze({wind: -40, solar: -40, demand: 35, worsen: 25});

const PRESETS = Object.freeze({
  lean: Object.freeze({label: 'Lean', note: 'forecast only', margin: 0}),
  balanced: Object.freeze({label: 'Balanced', note: '+50 MW', margin: 50}),
  reserve: Object.freeze({label: 'More reserve', note: '+110 MW', margin: 110}),
});

/** Hours the starter plans look ahead. Short on purpose: presets are starting points, not answers. */
const PRESET_LOOKAHEAD = 4;

const RUN = Object.freeze({quietMs: 1500, skipMs: 350, checkInHours: 4});

/** Efficiency (hindsight-optimal cost ÷ your cost) needed for one, two and three stars. */
const STAR_THRESHOLDS = Object.freeze([0.92, 0.96, 0.985]);

/** Carbon medal: emit no more than this share of what the cheapest possible shift for the actual weather emits. */
const CARBON_TARGET_SHARE = 1;

const SCENARIOS = Object.freeze({orbit: 12, operator: 3, band: 24, options: 8});

const OPPONENTS = Object.freeze({
  rookie: Object.freeze({name: 'Rookie', blurb: 'Plans each hour on its own, ignoring start-up costs, and patches gaps with gas.'}),
  operator: Object.freeze({name: 'Operator', blurb: 'Plans across 3 weather scenarios, then patches gaps with gas.'}),
  orbit: Object.freeze({name: 'ORBIT', blurb: 'Plans across 12 scenarios and replans every hour.'}),

/** Day types. Events are public warnings with a probability; both players face the same outcome. */
const ARCHETYPES = Object.freeze({
  storm: Object.freeze({title: 'Storm front', mission: 'A storm front may shut the wind farms down this afternoon.'}),
  trip: Object.freeze({title: 'Faulty pump', mission: 'A plant is running on a faulty pump and could trip without warning.'}),
  fog: Object.freeze({title: 'Morning fog', mission: 'Fog could smother solar output until late morning.'}),
  heatwave: Object.freeze({title: 'Heatwave', mission: 'Air-conditioning pushes the evening peak later and higher.'}),
  surge: Object.freeze({title: 'Cup final', mission: 'The final whistle sends kettles and TVs on at once.'}),

return {VERSION, HOURS, START_HOUR, WIND_CAPACITY, SOLAR_CAPACITY, FLEET, SHORTAGE, DEFAULT_RULES, ALERTS, PRESETS, PRESET_LOOKAHEAD, RUN, STAR_THRESHOLDS, CARBON_TARGET_SHARE, SCENARIOS, OPPONENTS, ARCHETYPES, ARCHETYPE_ODDS};

const __engine_mjs = (() => {
const {HOURS, FLEET, SHORTAGE, DEFAULT_RULES, PRESET_LOOKAHEAD} = __config_mjs;
/** Grid Shift physics and accounting: deterministic, browser-local. Money is illustrative GBP. */

const STATES = 1 << FLEET.length;
const ALL_UNITS = STATES - 1;
const typeMask = type => FLEET.reduce((m, u, i) => (u.type === type ? m | (1 << i) : m), 0);
const NUCLEAR = typeMask('Nuclear');
const COAL = typeMask('Coal');
const GAS = typeMask('Gas');

const isOn = (mask, i) => ((mask >> i) & 1) === 1;
const validMask = m => Number.isInteger(m) && m >= 0 && m < STATES;
const capacity = m => FLEET.reduce((s, u, i) => s + (isOn(m, i) ? u.capacity : 0), 0);
const changeCost = (m, p) => FLEET.reduce((s, u, i) => s + (isOn(m ^ p, i) ? u.change : 0), 0);
const startupCost = (m, p) => FLEET.reduce((s, u, i) => s + (isOn(m & ~p, i) ? u.startup : 0), 0);
const unitNames = mask => FLEET.filter((u, i) => isOn(mask, i)).map(u => u.id).join(' + ') || 'None';
const availableUnits = (rules = DEFAULT_RULES) => ALL_UNITS & ~(rules.disabled ?? 0);

/** Hours of notice unit i needs during the shift (Infinity = fixed for the shift). */
function leadTime(i, rules = DEFAULT_RULES) {
  const lead = FLEET[i].lead;
  if (lead === null) return Infinity;
  return rules.leadTimes === false ? 0 : lead;
}
/** Earliest hour unit i can be changed when hour h is live. */
const editableFrom = (i, h, rules) => h + leadTime(i, rules);
/** Bits that may no longer change at hour t when hour h is live. */
const lockedBits = (t, h, rules) => FLEET.reduce((m, u, i) => (t < editableFrom(i, h, rules) ? m | (1 << i) : m), 0);

/** Renewables first, then ascending variable cost. Tripped units produce nothing. */
function dispatch(mask, actual) {
  if (!validMask(mask)) throw Error('Invalid commitment mask');
  for (const k of ['demand', 'wind', 'solar']) if (!Number.isFinite(actual[k]) || actual[k] < 0) throw Error('Invalid conditions');
  const effective = mask & ~(actual.outage ?? 0);
  const available = actual.wind + actual.solar, renewable = Math.min(actual.demand, available);
  const windUsed = available ? renewable * actual.wind / available : 0, solarUsed = renewable - windUsed;
  let remaining = actual.demand - renewable, running = 0, emissions = 0;
  const outputs = FLEET.map((u, i) => {
    if (!isOn(effective, i)) return 0;
    const p = Math.min(remaining, u.capacity);
    remaining -= p; running += u.fixed + p * u.rate; emissions += p * u.co2;
    return p;
  });
  const shortage = Math.max(0, remaining), brownout = Math.min(shortage, SHORTAGE.brownoutShare * actual.demand), blackout = shortage - brownout;
  const conventional = outputs.reduce((s, v) => s + v, 0);
  return {effective, outputs, windUsed, solarUsed, renewable, conventional, served: renewable + conventional, shortage, brownout, blackout,
    curtailment: available - renewable, spare: Math.max(0, capacity(effective) - conventional), running, emissions,
    penalty: brownout * SHORTAGE.brownoutPrice + blackout * SHORTAGE.blackoutPrice};
}

/** One settled hour. `mask` in the record is what actually ran (tripped units removed). */
function settle({hour, mask, previousMask = 0, planMask = mask, actual}) {
  const d = dispatch(mask, actual), out = actual.outage ?? 0;
  const startup = startupCost(d.effective, previousMask), adjustment = changeCost(mask & ~out, planMask & ~out);
  return {hour, ...d, mask: d.effective, requested: mask, planMask, previousMask, actual: {...actual}, startup, adjustment,
    total: d.running + startup + adjustment + d.penalty};
}

function summarize(ledger) {
  const keys = ['running', 'startup', 'adjustment', 'penalty', 'total', 'shortage', 'brownout', 'blackout', 'emissions', 'curtailment', 'served', 'renewable'];
  return Object.fromEntries(keys.map(k => [k, ledger.reduce((s, l) => s + l[k], 0)]));
}

function validatePlan(plan, rules = DEFAULT_RULES) {
  if (!Array.isArray(plan) || plan.length !== HOURS || !plan.every(validMask)) throw Error('Invalid plan');
  if (plan.some(m => m & ~availableUnits(rules))) throw Error('Invalid plan: unit not in service');
  if (plan.some(m => (m & NUCLEAR) !== (plan[0] & NUCLEAR))) throw Error('Invalid plan: nuclear runs all shift or not at all');
}

/** Rejects edits to hours that are inside a unit's notice period. */
function checkSchedule(next, current, h, rules = DEFAULT_RULES) {
  if (!Array.isArray(next) || next.length !== HOURS) throw Error('Invalid schedule');
  for (let t = h; t < HOURS; t++) {
    if (!validMask(next[t])) throw Error('Invalid schedule');
    if (next[t] & ~availableUnits(rules)) throw Error('Unit not in service');
    if ((next[t] ^ current[t]) & lockedBits(t, h, rules)) throw Error('Locked: that change needs more notice');
  }
}

/** Switch unit i to `value` from hour `from` until the schedule already had it that way. */
function flipRun(schedule, i, from, value) {
  const next = [...schedule];
  for (let t = from; t < HOURS && isOn(next[t], i) !== value; t++) next[t] ^= 1 << i;
  return next;
}

/** Hour cost of every mask on one path; with `recourse`, each mask is first patched with the cheapest instant gas. */
function maskCosts(actual, planMask, allowed, recourse) {
  const out = actual.outage ?? 0, raw = new Float64Array(STATES).fill(Infinity);
  for (let m = 0; m < STATES; m++) {
    if (m & ~allowed) continue;
    const d = dispatch(m, actual);
    raw[m] = d.running + d.penalty + (planMask === null ? 0 : changeCost(m & ~out, planMask & ~out));
  }
  if (!recourse) return raw;

/** Exact DP over the 64 commitment states, averaging hour costs across `paths`.
 * `fixed[t]` = {bits, value} pins bits at hour t. Plan-change charges apply when `plan` is given.
 * From hour `recourseFrom` on, each schedule is valued as if gaps on a path will be patched with gas
 * (a two-stage approximation); earlier hours are already known, so nothing patches them. */
function dp({paths, from, to = HOURS, previousMask, plan, fixed, allowed, recourseFrom}) {
  let cost = new Float64Array(STATES).fill(Infinity);
  cost[previousMask] = 0;
  const back = [];

    const stage = new Float64Array(STATES).fill(Infinity), out = paths[0][t].outage ?? 0, outBefore = t > from ? paths[0][t - 1].outage ?? 0 : 0;
    const perPath = paths.map(p => maskCosts(p[t], plan ? plan[t] : null, allowed, t >= recourseFrom));
    for (let m = 0; m < STATES; m++) {
      if (m & ~allowed || (fixed?.[t] && (m & fixed[t].bits) !== fixed[t].value)) continue;
      stage[m] = perPath.reduce((s, c) => s + c[m], 0) / paths.length;
    }
    const next = new Float64Array(STATES).fill(Infinity), via = new Int8Array(STATES);
    for (let m = 0; m < STATES; m++) {
      if (stage[m] === Infinity) continue;
      for (let p = 0; p < STATES; p++) {
        if (cost[p] === Infinity) continue;
        const c = cost[p] + startupCost(m & ~out, p & ~outBefore) + stage[m];
        if (c < next[m]) { next[m] = c; via[m] = p; }
      }
    }
    back.push(via);
    cost = next;
  }

  for (let m = 1; m < STATES; m++) if (cost[m] < cost[best]) best = m;

  for (let i = back.length - 1; i >= 0; i--) { schedule[from + i] = best; best = back[i][best]; }

/** Best schedule for the given paths. At the start of a shift it also chooses whether nuclear runs. */
function solve({paths, from = 0, to = HOURS, previousMask = 0, plan = null, fixed = null, rules = DEFAULT_RULES, recourseFrom = Infinity}) {
  const allowed = availableUnits(rules);
  if (from > 0 || fixed) return dp({paths, from, to, previousMask, plan, fixed, allowed, recourseFrom});
  const options = [0, NUCLEAR].filter(n => (n & allowed) === n).map(n =>
    dp({paths, from, to, previousMask, plan, allowed, recourseFrom, fixed: Array.from({length: HOURS}, () => ({bits: NUCLEAR, value: n}))}));
  return options.reduce((a, b) => (b.expectedCost < a.expectedCost ? b : a));

/** Starter plans: a simple aid that looks only PRESET_LOOKAHEAD hours ahead at the central forecast plus a margin.
 * Nuclear is decided once for the shift. No scenarios, no events. */
function starterPlan(day, margin = 50, lookahead = PRESET_LOOKAHEAD) {

  const n = solve({paths: [padded], rules: day.rules}).schedule[0] & NUCLEAR, plan = [];
  const fixed = Array.from({length: HOURS}, () => ({bits: NUCLEAR, value: n}));

    plan[t] = dp({paths: [padded], from: t, to: Math.min(HOURS, t + lookahead), previousMask: prev, fixed, allowed: availableUnits(day.rules), recourseFrom: Infinity}).schedule[t];
    prev = plan[t];
  }
  return plan;
}

/** Cheapest set of gas units to add this hour (instant start). Never removes a unit. */
function gasCover({mask, actual, previousMask = 0, planMask = mask, rules = DEFAULT_RULES}) {
  if (dispatch(mask, actual).shortage < 1e-9) return mask;
  const free = availableUnits(rules) & GAS & ~mask & ~(actual.outage ?? 0);
  let best = mask, bestCost = settle({hour: 0, mask, previousMask, planMask, actual}).total;
  for (let add = free; add; add = (add - 1) & free) {
    const cost = settle({hour: 0, mask: mask | add, previousMask, planMask, actual}).total;
    if (cost < bestCost - 1e-9) { best = mask | add; bestCost = cost; }
  }
  return best;
}

/** Opponents receive only public information: the day, warnings, revealed history and their own schedule. */

/** Each hour's cheapest mix at the forecast, ignoring start-ups: the classic beginner plan that cycles units. */
function rookiePlan(day) {

function dayAheadPlan(day, warnings, count) {
  return solve({paths: makeScenarios(day, [], warnings, count, 'planner'), rules: day.rules, recourseFrom: 0}).schedule;
}

function describe(day, history, next, before, plan) {
  const h = history.length - 1, a = history[h], f = day.forecast.hours[h], mask = next[h];
  const net = a.demand - a.wind - a.solar, forecastNet = f.demand - f.wind - f.solar, d = dispatch(mask, a);
  const changes = FLEET.flatMap((u, i) => (isOn(mask ^ plan[h], i) ? [`${u.id} ${isOn(mask, i) ? 'on' : 'off'}`] : []));
  const ordered = FLEET.flatMap((u, i) => (u.lead && next.some((m, t) => t > h && isOn(m ^ before[t], i)) ? [u.id] : []));
  return `Net demand ${Math.round(net)} MW (${net >= forecastNet ? '+' : ''}${Math.round(net - forecastNet)} vs forecast). `
    + `${changes.length ? `Changed ${changes.join(', ')} from its plan.` : 'Kept its plan.'} `
    + `${ordered.length ? `Re-ordered ${ordered.join(', ')} for later hours. ` : ''}${Math.round(d.spare)} MW spare.`;

/** `decide` returns the opponent's full schedule from the current hour on, honouring notice periods. */
function createOpponent(level, day) {

    const h = history.length - 1, next = [...schedule];
    next[h] = gasCover({mask: schedule[h], actual: history[h], previousMask, planMask: plan[h], rules: day.rules});
    return next;
  };

    level,
    name: OPPONENTS[level].name,
    plan(warnings) {
      if (level === 'rookie') return rookiePlan(day);
      return dayAheadPlan(day, warnings, level === 'operator' ? SCENARIOS.operator : SCENARIOS.orbit);
    },
    decide({warnings, history, schedule, previousMask = 0, plan}) {
      if (!history.length || history.length > HOURS) throw Error('Reveal a valid current hour first');
      const h = history.length - 1;
      let next;

      history: history.map(a => ({...a})),

      schedule: schedule ? [...schedule] : null,

function exportCsv(seed, human, rival, rivalName = 'Opponent') {

/** A separate teaching example. No live game, storage or DOM is passed into it. */
function buildTourExample() {
  const base = makeDay('TOUR-12', {archetypes: [], title: 'Example shift', brief: 'An example day.'});

  const plan = starterPlan(day, 50).map(m => m | 1);
  plan[0] = 1;
  const options = decisionOptions({day, h: 0, actual: surprise, schedule: [...plan], plan, previousMask: 0, history: [surprise], warnings: []});
  const fix = options.find(o => o.kind === 'coal') ?? options.find(o => o.kind === 'gas');
  const human = [], orbitRows = [], orbit = createOpponent('orbit', day), orbitPlan = orbit.plan([]);

    human.push(settle({hour: h, mask: schedule[h], previousMask: prev, planMask: plan[h], actual: real[h]}));
    orbitSchedule = orbit.decide({warnings: [], history: real.slice(0, h + 1), schedule: orbitSchedule, previousMask: orbitPrev, plan: orbitPlan}).schedule;

    humanScore: scoreShift({ledger: human, best, budget}), orbitScore: scoreShift({ledger: orbitRows, best, budget}), humanTotal: summarize(human), orbitTotal: summarize(orbitRows)};

const __ui_format_mjs = (() => {

/** Cumulative cost lines, drawn as money spent above the perfect-hindsight shift so small gaps are visible. */
function costRace(series, {baseline, title = 'The cost race'}) {
  const w = 840, h = 190, l = 62, r = 40, t = 16, b = 30;

        <ol class="track" aria-label="Campaign days">${track.map((d, i) => `<li><button class="track-day ${d.result?.done ? 'done' : ''} ${d.id === next.id ? 'next' : ''}" data-action="campaign" data-day="${d.id}" ${d.unlocked ? '' : 'disabled'} aria-label="Day ${i + 1}: ${escapeHtml(d.title)}${d.unlocked ? '' : ' (locked)'}${d.result ? `, best ${d.result.stars} stars` : ''}"><b>${i + 1}</b>${d.result ? starMarkup(d.result.stars, false) : d.unlocked ? '<span class="open">open</span>' : '<span class="lock">🔒</span>'}</button></li>`).join('')}</ol>
        <button class="primary" data-action="campaign" data-day="${next.id}">Play day ${Number(next.id.slice(1))} →</button></article>
      <article class="mode-card daily"><span class="eyebrow">TODAY'S SHIFT · SAME DAY FOR EVERYONE</span><h3>${escapeHtml(daily.title)}</h3><p>${escapeHtml(daily.mission)}</p>
        <p class="code-line">${escapeHtml(daily.code)}${bests[`${daily.code}|${opponent}`] ? ` · your best ${starMarkup(bests[`${daily.code}|${opponent}`].stars, false)} ${percent(bests[`${daily.code}|${opponent}`].efficiency)}` : ''}</p>
        <button class="primary" data-action="daily">Play today →</button></article>
      <article class="mode-card free"><span class="eyebrow">FREE PLAY · ANY DAY CODE</span><h3>Pick a day</h3><p>Every code is a different forecast, weather and set of warnings. Share a code to race a friend.</p>
        <form id="free-form" class="seed-form"><label for="free-code">Day code</label><div class="seed-row"><input id="free-code" value="${escapeHtml(freeCode)}" maxlength="24" pattern="[A-Za-z0-9\\-]+" autocomplete="off" required><button class="primary" type="submit">Start →</button></div></form></article>
    </div>
    <section class="opponent-picker"><span class="eyebrow">OPPONENT FOR TODAY'S SHIFT AND FREE PLAY</span>
      <div class="segmented" role="radiogroup">${Object.entries(OPPONENTS).map(([key, o]) => `<button role="radio" aria-checked="${opponent === key}" data-opponent="${key}"><b>${o.name}</b><small>${o.blurb}</small></button>`).join('')}</div></section>
  </main>`;
}

/* ---------- Shared panels ---------- */

function chartPanel({rows, selected, current, band, warnings, phase, liveHour}) {
  const r = rows[selected];
  return `<section class="panel dispatch-panel"><div class="chart-heading"><h3>Demand &amp; generation</h3><div class="line-legend"><span class="dashed" style="--color:var(--yellow)">Forecast demand</span><span style="--color:#fff">Actual demand</span><span class="band-key">Likely need</span></div></div>
    ${timelineChart(rows, {selected, current, band, warnings})}
    <div class="chart-legend">${SOURCE_LABELS.map((label, i) => `<span style="--color:${SOURCE_COLORS[i]}">${label}</span>`).join('')}<span class="spare-key">Spare</span><span class="gap-key">Gap</span></div>
    <div class="chart-readout" aria-live="polite"><b>${clockLabel(selected)} <small>${r.kind === 'forecast' ? 'FORECAST' : r.kind === 'live' ? 'LIVE PREVIEW' : 'SETTLED'}</small></b><span>Demand <strong>${number(r.demand)}</strong></span><span>Supply <strong>${number(r.served)}</strong></span>
      <span class="${r.shortage > 0.5 ? 'bad' : 'good'}"><strong>${number(r.shortage > 0.5 ? r.shortage : r.spare)}</strong> ${r.shortage > 0.5 ? 'gap' : 'spare'} <small>MW</small></span>${band?.[selected] ? `<span>Likely need <strong>${number(band[selected].lo)}–${number(band[selected].hi)}</strong></span>` : ''}</div>
    <div class="chart-caption">${phase === 'play' && selected !== liveHour ? `<button class="text-button" data-action="now">↩ Back to ${clockLabel(liveHour)}</button>` : '<span>Tap a column to inspect or edit that hour.</span>'}<span>Faded = forecast · outline = spare · shaded = likely need (80% range)${phase === 'play' ? ' · <button class="text-button" data-action="forecast">Weather outlook ↗</button>' : ''}</span></div></section>`;
}

function statusPanel({row, demand, planning, ledger, streak, carbon, budget}) {
  const gap = row.shortage > 0.5, black = row.blackout > 0.5;
  return `<aside class="panel grid-status ${gap ? 'grid-alert' : ''}"><div class="status-heading"><span class="eyebrow">${planning ? 'FORECAST BALANCE' : 'THE CITY IS COUNTING ON YOU'}</span><b class="${gap ? 'bad' : 'good'}">${black ? 'BLACKOUT' : gap ? 'BROWNOUT' : 'LIGHTS ON'}</b></div>
    ${cityScene({served: row.served, demand, brownout: row.brownout, blackout: row.blackout})}
    <div class="live-balance"><strong>${number(row.served)}<small> / ${number(demand)} MW</small></strong><span>${gap ? `${number(row.shortage, 1)} MW unserved${black ? ' · districts dark' : ' · voltage reduced'}` : `${number(row.spare)} MW spare capacity`}</span></div>
    <div class="status-bottom">${planning ? `<span>Carbon target ≈ <b>${number(budget)} t</b></span><span>This plan <b class="${carbon > budget ? 'bad' : 'good'}">${number(carbon)} t</b></span>`
      : `<span><b>${ledger.length}/12</b> settled</span><span><b>${streak}</b> clean streak</span><span><b>${number(carbon)}</b>/≈${number(budget)} tCO₂</span>`}</div></aside>`;
}

function unitPanel({schedule, hour, liveHour, rules, conditions, dispatchRow, planning, plan, open, outageEnd}) {
  const t = hour, mask = schedule[t];
  const cards = FLEET.map((u, i) => {
    const disabled = Boolean(rules.disabled & (1 << i)), tripped = Boolean((conditions.outage ?? 0) & (1 << i)), on = isOn(mask, i);
    const from = planning ? 0 : editableFrom(i, liveHour, rules), locked = !planning && t < from;
    const changed = !planning && isOn(mask ^ plan[t], i);
    let note;
    if (disabled) note = 'Not in service today';
    else if (tripped) note = `Tripped${outageEnd?.[i] ? ` until ${clockLabel(outageEnd[i])}` : ''}`;
    else if (planning && isOn(NUCLEAR, i)) note = 'Runs all shift or not at all';
    else if (!planning && isOn(NUCLEAR, i)) note = 'Fixed for the shift';
    else if (locked) note = `Locked · next change ${from < HOURS ? clockLabel(from) : 'not this shift'}`;
    else if (changed) note = `+${pounds(u.change)}/h plan change`;
    else note = planning ? `Start ${pounds(u.startup)}${u.lead ? ` · needs ${u.lead}h notice` : ''}` : rules.leadTimes !== false && u.lead ? `${u.lead}h notice` : 'Instant';
    const output = dispatchRow ? dispatchRow.outputs[i] : null;
    return `<button class="unit ${on ? 'on' : ''} ${locked || isOn(NUCLEAR, i) && !planning ? 'locked' : ''} ${tripped ? 'tripped' : ''} ${changed ? 'changed' : ''}" style="--unit:${UNIT_COLORS[u.type]}" data-unit="${i}" aria-pressed="${on}" ${disabled ? 'disabled' : ''} aria-label="${u.id} ${u.name}, ${u.type}, ${on ? 'on' : 'off'}. ${note}">
      <span class="unit-top"><svg viewBox="0 0 43 38" aria-hidden="true">${ICONS[u.type]}</svg><span class="unit-name">${u.type}<b>${u.id}</b></span><span class="unit-state">${tripped ? 'TRIP' : on ? 'ON' : 'OFF'}</span></span>
      <span class="unit-power"><b>${output !== null && on ? `${number(output)}/` : ''}${u.capacity}</b> MW · £${u.rate}/MWh</span><span class="unit-note">${note}</span></button>`;
  }).join('');
  return `<section class="panel units ${open ? '' : 'collapsed'}"><div class="panel-head"><h3>Generators · ${clockLabel(t)}</h3>
    <button class="text-button" data-action="units" aria-expanded="${open}">${open ? 'Hide' : 'Show'}</button></div>
    ${open ? `<div class="unit-grid">${cards}</div><p class="auto-note">${planning ? 'Tap a unit to switch it for the selected hour. Output is allocated automatically: renewables first, then cheapest running units.'
      : 'A switch applies from the selected hour until that unit’s next scheduled change. Coal needs notice; gas is instant.'}</p>` : ''}</section>`;
}

/* ---------- Plan ---------- */

function planView({game, rows, band, warnings, selected, planTotal, planCarbon, budget, preset, undo, unitsOpen, goal}) {
  const day = game.session.day, f = day.forecast.hours[selected], row = rows[selected];
  return `<main id="main" class="plan">${steps(game)}
    <div class="page-title"><div><span class="eyebrow">YOUR MISSION · KEEP THE LIGHTS ON FOR 12 HOURS</span><h2>${escapeHtml(day.title)}</h2><p class="mission">${escapeHtml(day.mission)}</p>
      ${goal ? `<p class="goal">Goal: ${describeGoal(goal)}</p>` : ''}</div><button class="quiet" data-action="forecast">Weather outlook ↗</button></div>
    ${warningStrip(warnings)}
    <div class="strategy-row"><span class="eyebrow">STARTING PLAN</span><div class="presets" aria-label="Starting plan">${Object.entries(PRESETS).map(([key, p]) => `<button data-preset="${key}" aria-pressed="${preset === key}">${p.label} <small>${p.note}</small></button>`).join('')}</div>
      <button class="quiet undo" data-action="undo-plan" ${undo ? '' : 'disabled'} aria-label="Undo last plan edit">↶ Undo</button></div>
    <div class="command-view">${chartPanel({rows, selected, current: null, band, warnings, phase: 'plan'})}
      ${statusPanel({row: {...row, brownout: 0, blackout: row.shortage}, demand: f.demand, planning: true, carbon: planCarbon, budget})}</div>
    ${unitPanel({schedule: game.plan, hour: selected, liveHour: 0, rules: day.rules, conditions: f, dispatchRow: null, planning: true, plan: game.plan, open: unitsOpen})}
    <div class="action-bar"><div class="action-summary"><strong>${pounds(planTotal)} <small>at forecast</small></strong><span>${rows.filter(r => r.shortage > 0.5).length ? `${rows.filter(r => r.shortage > 0.5).length} forecast gaps` : '12 hours covered'} · presets ignore warnings</span></div>
      <div class="transport"><button class="quiet" data-action="copy">Use ${clockLabel(selected)} mix all shift</button><button class="primary" data-action="start">Commit plan &amp; take control →</button></div></div>
  </main>`;
}

/* ---------- Play ---------- */

function eventBanner({status, changes, feedback, running}) {
  let kind = 'calm', symbol = '✓', title = feedback || 'Grid holding steady', text = running ? 'Running through quiet hours. Pause whenever you like.' : 'Check the chart and warnings, make a call, then run the shift.';
  const change = changes[0], alert = status.events[0];
  if (status.blackout > 0.5) { kind = 'danger'; symbol = 'ϟ'; title = `${alert?.title ?? 'Power gap'} · blackout`; text = `${number(status.shortage)} MW short. Blackouts cost £2,500/MWh and break the Lights-on medal.`; }
  else if (status.shortage > 0.5) { kind = 'danger'; symbol = 'ϟ'; title = `${alert?.title ?? 'Power gap'} · brownout`; text = `${number(status.shortage)} MW short, within the brownout band (£300/MWh). Cover it, or ride it out.`; }
  else if (change) {
    kind = 'weather'; symbol = change.warning.icon;
    const w = change.warning, unit = w.unit !== null ? FLEET[w.unit] : null;
    title = {confirmed: `${w.title} confirmed`, started: `${w.title} has arrived`, tripped: `${unit?.id ?? 'Unit'} tripped`, cleared: `${w.title}: all clear`}[change.change];
    text = {confirmed: `Expected ${clockLabel(w.start)}–${clockLabel(w.end)}. Ironbridge needs 2 hours' notice, Moorfield 1.`, started: `Until ${clockLabel(w.end)}.`,
      tripped: `${unit?.name ?? 'The unit'} is offline until ${clockLabel(w.end)}.`, cleared: 'The warning has lifted.'}[change.change];
  } else if (alert) { kind = 'weather'; symbol = {wind: '≈', cloud: '☁', demand: '↗'}[alert.kind]; title = `${alert.title} · grid holding`; text = `${alert.detail}: ${alert.delta > 0 ? '+' : ''}${number(alert.delta)} MW.`; }
  return `<div class="event-banner ${kind}" role="status"><span class="event-symbol">${symbol}</span><div><b>${escapeHtml(title)}</b><span>${escapeHtml(text)}</span></div><span class="run-state">${running ? '<i></i> RUNNING' : 'Ⅱ PAUSED'}</span></div>`;
}

const OPTION_ICON = {hold: '◇', gas: 'ϟ', coal: '⏱', standdown: '↘'};
function optionCards(options, {draftKey}) {
  return `<section class="options"><div class="options-head"><h3>Your move</h3><span>Costs are projected to 20:00 across likely weather, assuming later gaps get gas. They inform, they don't decide.</span></div>
    <div class="option-cards">${options.map((o, i) => {
      const current = o.kind === 'hold';
      return `<button class="option ${o.kind} ${o.kind === 'gas' && o.now.shortage < 0.5 && options[0].now.shortage > 0.5 ? 'urgent' : ''}" data-option="${i}" data-key="${draftKey}" ${current ? 'aria-pressed="true"' : ''}>
        <span class="option-icon" aria-hidden="true">${OPTION_ICON[o.kind]}</span><span class="option-body"><b>${escapeHtml(o.title)}</b><small>${escapeHtml(o.detail)}</small></span>
        <span class="option-costs">${current ? `<em>${pounds(o.now.total)}<small>this hour</small></em><em>${pounds(o.rest)}<small>to 20:00</small></em>`
          : `<em class="${o.nowDelta < -0.5 ? 'good' : o.nowDelta > 0.5 ? 'bad' : ''}">${signedPounds(o.nowDelta)}<small>this hour</small></em><em class="${o.restDelta < -0.5 ? 'good' : o.restDelta > 0.5 ? 'bad' : ''}">${signedPounds(o.restDelta)}<small>to 20:00</small></em>`}</span></button>`;
    }).join('')}</div></section>`;
}

function playView({game, rows, band, warnings, selected, status, changes, options, row, spend, carbon, budget, streak, feedback, running, undo, unitsOpen, outageEnd}) {
  const v = game.view, h = v.hour, day = game.session.day;
  const conditions = selected === h ? v.actual : {...day.forecast.hours[selected], outage: rows[selected].outage};
  return `<main id="main" class="play ${running ? 'is-running' : ''}">${steps(game)}
    <div class="page-title"><div><span class="eyebrow">${escapeHtml(day.title).toUpperCase()} · KEEP THE LIGHTS ON · CONTROL THE COST</span><h2>${clockLabel(h)} <span class="muted">/ ${clockLabel(h + 1)}</span> <small>HOUR ${h + 1}/12</small></h2></div>
      <div class="shift-meters"><div><small>SHIFT SPEND</small><b>${pounds(spend)}</b></div><div><small>CARBON SO FAR</small><b>${number(carbon)}<span>/≈${number(budget)} t</span></b></div></div></div>
    ${eventBanner({status, changes, feedback, running})}
    ${warningStrip(warnings, {compact: true})}
    <div class="command-view">${chartPanel({rows, selected, current: h, band, warnings, phase: 'play', liveHour: h})}
      ${statusPanel({row, demand: v.actual.demand, planning: false, ledger: v.ledger, streak, carbon, budget})}</div>
    ${optionCards(options, {draftKey: h})}
    <div class="decision-meta"><span>${undo ? 'Preview updated. Nothing is charged until the hour settles.' : 'Pick a move or switch units yourself. The chart previews it before you commit.'}</span>
      <span><button class="text-button" data-action="undo-draft" ${undo ? '' : 'disabled'}>↶ Undo</button><button class="text-button" data-action="reset-draft">Reset changes</button></span></div>
    ${unitPanel({schedule: game.draft, hour: selected, liveHour: h, rules: day.rules, conditions, dispatchRow: selected === h ? row : null, planning: false, plan: game.plan, open: unitsOpen, outageEnd})}
    <div class="action-bar"><div class="action-summary"><strong>${pounds(row.total)} <small>this hour</small></strong><button class="text-button" data-action="hour-costs">${row.penalty > 0.5 ? `${pounds(row.penalty)} unserved penalty` : `${pounds(row.adjustment)} plan changes`} · breakdown</button></div>
      <div class="transport"><button class="quiet step-button" data-action="settle" aria-label="Settle this hour and advance">Step →</button>
        <button class="quiet skip-button" data-action="skip" aria-label="Run quickly to the next decision">⏭ Skip</button>
        <button class="primary ${running ? 'pause-button' : ''}" data-action="${running ? 'pause' : 'run'}">${running ? 'Ⅱ Pause' : h === HOURS - 1 ? 'Finish shift →' : '▶ Run shift'}</button></div></div>
  </main>`;
}

/* ---------- Results ---------- */

function resultsView({game, score, rival, coach, replay, best, goal, goalOk, nextDay, isBest, previousBest}) {
  const v = game.view, a = v.ledger[replay], b = v.rivalLedger[replay], delta = score.total - rival.total;
  const headline = Math.abs(delta) < 1 ? `You and ${v.opponent.name} finished level.` : delta < 0 ? `You beat ${v.opponent.name} by ${pounds(-delta)}.` : `${v.opponent.name} came in ${pounds(delta)} cheaper.`;
  return `<main id="main" class="results">${steps(game)}
    <section class="result-hero panel"><div class="result-stars">${starMarkup(score.stars)}</div>
      <div class="result-copy"><span class="eyebrow">SHIFT COMPLETE · EFFICIENCY AGAINST PERFECT HINDSIGHT</span><h2>${percent(score.efficiency)} efficient</h2><p>${headline}</p>
        <div class="medals"><span class="medal ${score.medals.reliability ? 'won' : ''}">🛡 Lights on ${score.medals.reliability ? '✓' : `✗ <small>${number(score.brownout + score.blackout, 1)} MWh unserved</small>`}</span>
          <span class="medal ${score.medals.carbon ? 'won' : ''}">🌿 Carbon ${score.medals.carbon ? '✓' : '✗'} <small>${number(score.emissions)}/${number(score.budget)} t</small></span></div>
        ${goal ? `<p class="goal ${goalOk ? 'good' : 'bad'}">${goalOk ? '✓ Goal met' : '✗ Goal missed'}: ${describeGoal(goal)}</p>` : ''}
        <p class="best-line">${isBest ? '★ New personal best for this day' : previousBest ? `Personal best: ${starMarkup(previousBest.stars, false)} ${percent(previousBest.efficiency)}` : ''}</p></div></section>
    <div class="scorecards"><article class="scorecard you"><h3>YOU</h3><strong>${pounds(score.total)}</strong><p>${percent(score.efficiency)} · ${starMarkup(score.stars, false)}</p></article>
      <article class="scorecard rival"><h3>${escapeHtml(v.opponent.name.toUpperCase())}</h3><strong>${pounds(rival.total)}</strong><p>${percent(rival.efficiency)} · ${starMarkup(rival.stars, false)}</p></article>
      <article class="scorecard best"><h3>PERFECT HINDSIGHT</h3><strong>${pounds(best)}</strong><p>Knew the whole day in advance</p></article></div>
    <div class="result-actions">${nextDay ? `<button class="primary" data-action="campaign" data-day="${nextDay.id}">Day ${Number(nextDay.id.slice(1))}: ${escapeHtml(nextDay.title)} →</button>` : `<button class="primary" data-action="home">Take another shift →</button>`}
      <button class="quiet" data-action="retry">Try this day again</button><button class="quiet" data-action="share">Copy result</button></div>
    <section class="panel coach"><div class="panel-head"><h3>Coach</h3><span class="tag">plan ${pounds(coach.planRegret)} · in-shift ${pounds(coach.playRegret)} above best</span></div>
      <div class="coach-body">${coach.worst ? `<div class="worst"><span class="eyebrow">YOUR COSTLIEST CALL · ${clockLabel(coach.worst.hour)}</span><p>With hindsight, <b>${escapeHtml(coach.worst.moves.join(', ') || 'a different mix')}</b> would have saved <b>${pounds(coach.worst.regret)}</b>${coach.worst.note ? `. That hour, ${escapeHtml(coach.worst.note)}` : ''}.</p>
        <button class="text-button" data-replay="${coach.worst.hour}">Replay ${clockLabel(coach.worst.hour)} ↓</button></div>` : '<div class="worst"><p>No single hour cost you more than £100 against hindsight. Clean shift.</p></div>'}
        ${coach.tips.length ? `<ul class="tips">${coach.tips.map(t => `<li>${escapeHtml(t)}</li>`).join('')}</ul>` : ''}</div></section>
    ${costRace([{label: 'You', rows: v.ledger, color: 'var(--yellow)'}, {label: v.opponent.name, rows: v.rivalLedger, color: 'var(--cyan)'}], {baseline: coach.bestLedger})}
    <section class="panel result-replay" id="replay"><div class="panel-head"><h3>Where did the money go?</h3><span class="tag">${clockLabel(replay)}–${clockLabel(replay + 1)}</span></div>
      <div class="replay-hours" role="group" aria-label="Choose a replay hour">${v.ledger.map((l, i) => `<button class="hour-button ${l.shortage > 0.5 ? 'risk' : ''}" data-replay="${i}" aria-pressed="${replay === i}"><span>${String(8 + i).padStart(2, '0')}</span><small>${l.shortage > 0.5 ? 'gap' : coach.hours[i].regret > 300 ? '£' : '✓'}</small></button>`).join('')}</div>
      <div class="replay-conditions"><span>Demand <b>${number(a.actual.demand)} MW</b></span><span>Wind <b>${number(a.actual.wind)} MW</b></span><span>Solar <b>${number(a.actual.solar)} MW</b></span>${a.actual.outage ? `<span class="bad">Tripped <b>${FLEET.filter((u, i) => isOn(a.actual.outage, i)).map(u => u.id).join(', ')}</b></span>` : ''}</div>
      <div class="replay-grid">${[[a, 'YOU', 'yellow'], [b, v.opponent.name.toUpperCase(), 'good'], [coach.bestLedger[replay], 'HINDSIGHT', 'purple']].map(([l, name, cls]) => `<div class="replay-card"><h3 class="${cls}">${escapeHtml(name)}</h3>
        <div class="mix-row"><span>Plan</span>${mixMarkup(l.planMask)}</div><div class="mix-row"><span>Ran</span>${mixMarkup(l.mask, l.planMask)}</div><div class="replay-cost">${pounds(l.total)} <small>${l.shortage > 0.5 ? `${number(l.shortage, 1)} MWh unserved` : `${number(l.spare)} MW spare`}</small></div></div>`).join('')}</div>
      <p class="replay-reason"><b>${escapeHtml(v.opponent.name)}’s decision:</b> ${escapeHtml(v.rivalNotes[replay])}</p></section>
    <div class="details-actions"><button class="quiet" data-action="results-details">Costs &amp; impact</button><button class="quiet" data-action="audit">Hourly records</button><button class="quiet" data-action="download">Download CSV</button></div>
  </main>`;
}

return {header, footer, homeView, planView, playView, resultsView};
})();

const __ui_dialogs_mjs = (() => {

const {unitNames, summarize} = __engine_mjs;
const {clockLabel} = __world_mjs;
const {number, pounds, percent, escapeHtml, warningLabel} = __ui_format_mjs;
const {forecastChart} = __ui_charts_mjs;
/** Dialog bodies. Each returns {title, body, actions}. */

function costRows(total) {

}

function rulesDialog() {
  const leadText = FLEET.map(u => `${u.id} ${u.lead === null ? 'fixed for the shift' : u.lead ? `${u.lead}h notice` : 'instant'}`).join(' · ');

const __ui_tour_mjs = (() => {
const {buildTourExample} = __support_mjs;
const {timelineData, needBand} = __experience_mjs;
const {dispatch, unitNames} = __engine_mjs;
const {number, pounds, signedPounds, percent, starMarkup, escapeHtml} = __ui_format_mjs;
const {timelineChart, costRace} = __ui_charts_mjs;
/** A ~30-second interactive tour with its own example and clock. It never touches the live game. */

const CAPTIONS = [
  ['See the whole shift.', 'Bars are your generators meeting demand. The shaded band is the likely range of demand your units must cover, given weather uncertainty.'],
  ['Commit. Then run.', 'Pick a starting plan and commit. Run carries you through quiet hours; Skip races to the next decision.'],
  ['Surprise: the wind drops.', ''],
  ['Choose your move.', ''],
  ['Warnings stop the clock.', 'Storms are confirmed two hours ahead; Ironbridge coal needs exactly two hours’ notice. Probabilities update as the day unfolds.'],
  ['Graded against perfect hindsight.', 'Stars measure efficiency against the best possible shift for that exact weather, so a stormy day never drags your grade down.'],
];

function createTour({dialog, onOpen, onClose}) {
  let data = null, step = 0, frame = 0, auto = true, timers = [];
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const reduced = () => window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function schedule() {
    clear();
    if (!auto || !dialog.open || step === CAPTIONS.length - 1) return;
    if ([1, 3].includes(step) && frame === 0) timers.push(setTimeout(() => { frame = 1; render(); }, 1600));
    timers.push(setTimeout(() => { step++; frame = 0; render(); schedule(); }, step === 3 ? 6500 : 4800));
  }

  function chart(rows, current, band = null, warnings = []) {
    return `<section class="panel dispatch-panel">${timelineChart(rows, {selected: current ?? 0, current, band, warnings, id: 'tour', interactive: false})}</section>`;
  }

  function render() {
    const d = data, gap = dispatch(d.plan[0], d.surprise).shortage, windDrop = d.expected.wind - d.surprise.wind;
    const live = step >= 2 && step <= 3, fixed = step === 3 && frame === 1;
    const schedule0 = fixed ? d.fixed : d.plan;
    const rows = timelineData({day: d.day, schedule: schedule0, history: live ? [d.surprise] : [], ledger: []});
    let visual;
    if (step === 5) {
      visual = `<div class="tour-score"><span>EXAMPLE PLAYER ${starMarkup(d.humanScore.stars, false)}<b>${percent(d.humanScore.efficiency)}</b></span><span>ORBIT ${starMarkup(d.orbitScore.stars, false)}<b>${percent(d.orbitScore.efficiency)}</b></span></div>
        ${costRace([{label: 'Example player', rows: d.human, color: 'var(--yellow)'}, {label: 'ORBIT', rows: d.orbit, color: 'var(--cyan)'}], {baseline: d.best})}`;
    } else if (step === 4) {
      const warning = [{id: 0, kind: 'storm', title: 'Storm front', icon: '≈', status: 'possible', prob: 0.65, window: [5, 8], detail: ''}];
      visual = `<div class="tour-stage-title"><span>08:00–20:00 · 12 HOURS</span><span>EXAMPLE WARNING</span></div>${chart(rows, null, needBand(d.day, [], []), warning)}
        <div class="tour-demo-controls"><span class="warning-chip possible"><b>≈ Storm front</b><span>65% · 13:00–17:00</span></span><button class="quiet" tabindex="-1">⏭ Skip</button><button class="primary" tabindex="-1">▶ Run shift</button></div>`;
    } else {
      const banner = live ? `<div class="event-banner ${fixed ? 'calm' : 'danger'}"><span class="event-symbol">${fixed ? '✓' : '≈'}</span><div><b>${fixed ? 'Power restored' : 'Wind drop · shift paused'}</b><span>${fixed ? `${unitNames(d.fixed[0] & ~d.plan[0])} bridges now; coal takes over next hour` : `${number(d.expected.wind)} → ${number(d.surprise.wind)} MW wind · ${number(gap)} MW short`}</span></div></div>`
        : '<div class="tour-stage-title"><span>08:00–20:00 · 12 HOURS</span><span>EXAMPLE SHIFT</span></div>';
      const controls = step === 0 ? '<span class="tag">BALANCED PLAN</span><span>Choose a starting plan, then commit.</span>'
        : step === 1 ? `<button class="primary ${frame ? '' : 'tour-focus'}" data-tour-act="animate">${frame ? '▶ Running through quiet hours' : 'Commit plan &amp; take control →'}</button>`
        : step === 2 ? '<span class="bad">The clock waits for you. No rush.</span>'
        : `<div class="option-cards tour-options">${d.options.map(o => `<button class="option ${o.kind} ${o.kind === 'coal' && !frame ? 'tour-focus' : ''} ${o.kind === 'coal' && frame ? 'chosen' : ''}" data-tour-act="animate" tabindex="-1"><span class="option-body"><b>${escapeHtml(o.title)}</b><small>${o.kind === 'hold' ? `${pounds(o.now.total)} this hour` : `${signedPounds(o.nowDelta)} now · ${signedPounds(o.restDelta)} to 20:00`}</small></span></button>`).join('')}</div>`;
      visual = `${banner}${chart(rows, live ? 0 : null, step === 0 ? needBand(d.day, [], []) : null)}<div class="tour-demo-controls">${controls}</div>`;
    }
    const caption = step === 2 ? `Wind is ${number(windDrop)} MW below forecast. The shift pauses with a ${number(gap)} MW gap. Blackouts cost £2,500 per MWh.`
      : step === 3 ? 'Each card shows its cost now and projected to 20:00. Gas is instant; coal is cheaper but needs notice, so gas can bridge until it arrives.' : CAPTIONS[step][1];
    dialog.innerHTML = `<div class="tour-head"><div><h2 id="tour-title">Grid Shift in 30 seconds</h2><span>INTERACTIVE EXAMPLE · YOUR SHIFT IS SAFE</span></div><button class="text-button" data-tour-act="close">${step === 5 ? 'Close' : 'Skip tour'}</button></div>
      <div class="tour-stage">${visual}</div>
      <div class="tour-caption" aria-live="polite"><h3>${CAPTIONS[step][0]}</h3><p>${caption}</p></div>
      <div class="tour-nav"><div class="tour-dots" aria-label="Step ${step + 1} of ${CAPTIONS.length}">${CAPTIONS.map((c, i) => `<i class="${step === i ? 'active' : ''}"></i>`).join('')}</div>
        <div class="tour-buttons">${step === 5 ? '<button class="quiet" data-tour-act="replay">↺ Replay</button><button class="primary" data-tour-act="close">Back to the game →</button>'
          : `<button class="quiet" data-tour-act="back" ${step ? '' : 'disabled'}>← Back</button><button class="quiet" data-tour-act="pause">${auto ? 'Ⅱ Pause' : '▶ Play'}</button><button class="primary" data-tour-act="next">Next →</button>`}</div></div>`;
  }

  function open() {
    onOpen();
    data ??= buildTourExample();
    step = 0; frame = 0; auto = !reduced();
    render();
    dialog.showModal();
    schedule();
  }
  function close() { clear(); dialog.close(); onClose(); }

  dialog.addEventListener('click', e => {
    const el = e.target.closest('[data-tour-act]');
    if (!el) return;
    const act = el.dataset.tourAct;
    if (act === 'close') return close();
    if (act === 'animate') { frame = 1; render(); schedule(); }
    if (act === 'next') { step = Math.min(CAPTIONS.length - 1, step + 1); frame = 0; render(); schedule(); }
    if (act === 'back') { step = Math.max(0, step - 1); frame = 0; render(); schedule(); }
    if (act === 'pause') { auto = !auto; render(); schedule(); }
    if (act === 'replay') { step = 0; frame = 0; auto = !reduced(); render(); schedule(); }
  });
  dialog.addEventListener('close', clear);
  dialog.addEventListener('cancel', clear);
  return {open, close};
}

return {createTour};
})();

if (!OPPONENTS[prefs.opponent]) prefs.opponent = 'orbit';
const bests = load(STORE.bests, {}), progress = load(STORE.campaign, {});

let cache = {}, dailyCache = null;

let runTimer = null, fast = false, lastAdvanceAt = 0;

/* ---------- Persistence ---------- */

function save() {

}

/* ---------- Game lifecycle ---------- */

function makeGame({mode, seed, campaignId = null, opponent}) {
  const session = sessionFor({seed, campaignId, opponent});
  return {mode, seed, campaignId, opponent, session, phase: 'plan', plan: starterPlan(session.day, PRESETS.balanced.margin), preset: 'balanced',
    settled: [], view: session.view(), draft: null, selected: 0, changes: []};
}

function requestStart(opts) {
  if (game && game.phase === 'play') {
    pendingStart = opts;
    openOverlay({title: 'Leave the current shift?', body: `<p>Your shift at ${clockLabel(game.view.hour)} will be replaced. Its progress isn't scored.</p>`,
      actions: '<button data-close>Keep playing</button><button class="primary" data-action="accept-start">Start the new shift</button>'});
    return;
  }
  begin(opts);
}

function begin(opts) {
  pauseRun();
  game = makeGame(opts);
  screen = 'game';
  undoPlan = null; undoDraft = null; feedback = ''; replay = 0; cache = {}; unitsOpen = {plan: true, play: false};
  save();
  render();
  window.scrollTo({top: 0});
}

function editPlan(next) {
  undoPlan = [...game.plan];
  game.plan = next;
  game.preset = 'custom';
  save();
}

/* ---------- Run control ---------- */

function pauseRun() { clearTimeout(runTimer); runTimer = null; progression.pause(); }

function scheduleRun() {
  clearTimeout(runTimer);
  if (!progression.running || game?.phase !== 'play') return;
  const ticket = progression.ticket(game.view.hour);
  runTimer = setTimeout(() => settleCurrent(ticket, true), fast ? RUN.skipMs : RUN.quietMs);
}

function startRun(isFast) {
  if (game.phase !== 'play') return;
  if (currentRow().shortage > 0.5) { action('settle'); return; }
  fast = isFast;
  progression.run(game.view.hour, {checkIn: !isFast});
  feedback = '';
  render();
  scheduleRun();
}

function settleCurrent(ticket, automatic = false) {
  if (game.phase !== 'play' || !progression.consume(ticket, game.view.hour)) return;
  const before = game.view, oldHour = before.hour;
  game.view = game.session.settle(game.draft);
  game.settled.push([...game.draft]);
  lastAdvanceAt = Date.now();
  undoDraft = null;
  const settledRow = game.view.ledger.at(-1);
  if (game.view.complete) {
    game.phase = 'results';
    replay = 0;
    pauseRun();
    recordResult();
  } else {
    const h = game.view.hour, f = day().forecast.hours;
    game.draft = [...game.view.schedule];
    game.selected = h;
    game.changes = warningChanges(before.warnings, game.view.warnings);
    const stop = !automatic || needsIntervention({actual: game.view.actual, forecast: f[h], mask: game.draft[h], previousActual: before.actual, previousForecast: f[h - 1],
      warnings: game.view.warnings, previousWarnings: before.warnings, previousShortage: settledRow.shortage});
    const wasRunning = progression.running;
    progression.arrived(h, {needsDecision: stop});
    feedback = stop ? '' : wasRunning && !progression.running ? 'Check-in · take a look ahead' : `Hour delivered · ${streakFor(game.view.ledger)} clean in a row`;
  }
  save();
  render();
  if (game.view.complete) window.scrollTo({top: 0});
  else scheduleRun();
  toast(game.view.complete ? '12 hours complete. Graded against perfect hindsight.'
    : `${clockLabel(oldHour)} ${settledRow.shortage > 0.5 ? 'settled with unserved demand' : 'delivered'} · ${'£' + Math.round(settledRow.total).toLocaleString('en-GB')}${progression.running ? '' : ' · paused'}`);
}

function advance() {
  if (Date.now() - lastAdvanceAt < 400) return;
  pauseRun();
  if (game.phase !== 'play') return;
  progression.run(game.view.hour);
  settleCurrent(progression.ticket(game.view.hour), false);
}

/* ---------- Edits ---------- */

function toggleUnit(i) {
  if (game.phase === 'plan') {
    const next = [...game.plan];
    if (isOn(NUCLEAR, i)) { const value = !isOn(next[0], i); for (let t = 0; t < HOURS; t++) next[t] = value ? next[t] | (1 << i) : next[t] & ~(1 << i); }
    else next[game.selected] ^= 1 << i;
    editPlan(next);
    render(`[data-unit="${i}"]`);
    return;
  }
  const h = game.view.hour, u = FLEET[i];
  if (isOn(NUCLEAR, i)) { toast('Nuclear runs all shift or not at all. That was decided in the plan.'); return; }
  const from = Math.max(game.selected, editableFrom(i, h, day().rules));
  if (from >= HOURS) { toast(`${u.id} needs ${u.lead} hours' notice. Too late to change it this shift.`); return; }
  pauseRun();
  undoDraft = [...game.draft];
  game.draft = flipRun(game.draft, i, from, !isOn(game.draft[from], i));
  feedback = '';
  if (from > game.selected) toast(`${u.id} needs notice: the change takes effect from ${clockLabel(from)}.`);
  save();
  render(`[data-unit="${i}"]`);
}

function applyOption(index) {
  const o = options()[index];
  if (!o || o.kind === 'hold') return;
  pauseRun();
  const before = currentRow();
  undoDraft = [...game.draft];
  game.draft = [...o.schedule];
  game.selected = game.view.hour;
  feedback = before.shortage > 0.5 && currentRow().shortage < 0.5 ? 'Power restored · nice recovery' : o.title;
  save();
  render();
  toast(feedback);
}

function share() {
  const r = results(), text = shareText({seed: game.seed, title: day().title, score: r.score, rival: {name: game.view.opponent.name, efficiency: r.rival.efficiency}});
  const fallback = () => openOverlay(shareDialog(text));
  try { navigator.clipboard.writeText(text).then(() => toast('Result copied. Paste it anywhere.'), fallback); } catch { fallback(); }
}

function download() {
  const csv = exportCsv(game.seed, game.view.ledger, game.view.rivalLedger, game.view.opponent.name);
  const url = URL.createObjectURL(new Blob([csv], {type: 'text/csv;charset=utf-8;'})), a = document.createElement('a');
  a.href = url;
  a.download = `grid-shift-${game.seed.toLowerCase()}.csv`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Downloaded 24 records: 12 for you, 12 for your opponent.');
}

function action(name, el = null) {
  switch (name) {
    case 'home': pauseRun(); screen = 'home'; save(); render(); window.scrollTo({top: 0}); break;
    case 'resume': screen = 'game'; save(); render(); break;
    case 'campaign': { const d = campaignDay(el?.dataset.day); if (d) requestStart({mode: 'campaign', seed: d.seed, campaignId: d.id, opponent: d.opponent}); break; }
    case 'daily': requestStart({mode: 'daily', seed: dailyCode(), opponent: prefs.opponent}); break;
    case 'accept-start': overlay.close(); if (pendingStart) begin(pendingStart); pendingStart = null; break;
    case 'tour': tour.open(); break;
    case 'rules': openOverlay(rulesDialog()); break;
    case 'forecast': openOverlay(forecastDialog(day(), game.view.history, game.view.warnings)); break;
    case 'units': unitsOpen[game.phase] = !unitsOpen[game.phase]; render('[data-action="units"]'); break;
    case 'undo-plan': if (undoPlan) { const previous = [...game.plan]; game.plan = [...undoPlan]; undoPlan = previous; game.preset = 'custom'; save(); render('[data-action="undo-plan"]'); toast('Plan edit undone.'); } break;
    case 'copy': editPlan(Array(HOURS).fill(game.plan[game.selected])); render('[data-action="copy"]'); toast(`${clockLabel(game.selected)} mix applied to all 12 hours.`); break;
    case 'start':
      if (game.phase !== 'plan') break;
      pauseRun();
      game.view = game.session.start(game.plan);
      game.phase = 'play'; game.settled = []; game.draft = [...game.view.schedule]; game.selected = 0; game.changes = [];
      undoDraft = null; feedback = ''; cache.bandKey = null;
      save(); render(); window.scrollTo({top: 0}); toast('Plan committed. Your shift is live.');
      break;
    case 'now': game.selected = game.view.hour; render(); break;
    case 'undo-draft': if (undoDraft) { pauseRun(); game.draft = undoDraft; undoDraft = null; feedback = 'Move undone'; save(); render(); } break;
    case 'reset-draft': pauseRun(); undoDraft = [...game.draft]; game.draft = [...game.view.schedule]; feedback = 'Changes reset'; save(); render(); break;
    case 'run': startRun(false); break;
    case 'skip': startRun(true); break;
    case 'pause': pauseRun(); render(); break;
    case 'settle': { if (game.phase !== 'play') break; pauseRun(); const row = currentRow(); if (row.shortage > 0.5) openOverlay(confirmShortageDialog(row)); else advance(); break; }
    case 'accept-shortage': overlay.close(); advance(); break;
    case 'hour-costs': openOverlay(hourCostsDialog(game.view.hour, currentRow())); break;
    case 'results-details': openOverlay(detailsDialog(game.view.ledger, game.view.rivalLedger, game.view.opponent.name, results().coach.bestLedger)); break;
    case 'audit': openOverlay(auditDialog(game.view.ledger, game.view.rivalLedger, game.view.opponent.name)); break;
    case 'download': download(); break;
    case 'share': share(); break;
    case 'copy-share': { const area = q('.share-text'); area?.select(); try { navigator.clipboard.writeText(area.value).then(() => toast('Copied.')); } catch { document.execCommand?.('copy'); } break; }
    case 'retry': openOverlay(retryDialog()); break;
    case 'accept-retry': overlay.close(); begin({mode: game.mode, seed: game.seed, campaignId: game.campaignId, opponent: game.opponent}); break;
  }
}

/* ---------- Events ---------- */

app.addEventListener('click', e => {
  const el = e.target.closest('button,[data-chart-hour]');
  if (!el || el.disabled) return;
  if (el.dataset.chartHour !== undefined) {
    const t = Number(el.dataset.chartHour);
    if (game.phase === 'play') { pauseRun(); game.selected = Math.max(game.view.hour, t); if (t < game.view.hour) toast('Settled hours can’t change. Showing the live hour.'); }
    else game.selected = t;
    save(); render();
  } else if (el.dataset.option !== undefined) applyOption(Number(el.dataset.option));
  else if (el.dataset.action) action(el.dataset.action, el);
  else if (el.dataset.replay !== undefined) { replay = Number(el.dataset.replay); render(`[data-replay="${replay}"]`); if (el.closest('.coach')) q('#replay')?.scrollIntoView({behavior: 'smooth'}); }
  else if (el.dataset.preset) {
    const key = el.dataset.preset;
    editPlan(starterPlan(day(), PRESETS[key].margin));
    game.preset = key;
    save(); render(`[data-preset="${key}"]`);
    toast(key === 'lean' ? 'Lean: no cushion, cheapest if the forecast holds.' : key === 'reserve' ? 'More reserve: extra capacity against surprises, at a standby cost.' : 'Balanced: a 50 MW cushion over the forecast.');
  } else if (el.dataset.opponent) { prefs.opponent = el.dataset.opponent; save(); render(`[data-opponent="${prefs.opponent}"]`); }
  else if (el.dataset.unit !== undefined) toggleUnit(Number(el.dataset.unit));
});

app.addEventListener('keydown', e => {
  const column = e.target.closest('[data-chart-hour]');
  if (column && ['Enter', ' '].includes(e.key)) { e.preventDefault(); column.dispatchEvent(new MouseEvent('click', {bubbles: true})); return; }
  const hourButton = e.target.closest('[data-replay]');
  if (hourButton && ['ArrowLeft', 'ArrowRight'].includes(e.key)) { e.preventDefault(); replay = (replay + (e.key === 'ArrowRight' ? 1 : -1) + HOURS) % HOURS; render(`[data-replay="${replay}"]`); }
});

overlay.addEventListener('click', e => {
  const button = e.target.closest('button');
  if (!button) return;
  if (button.hasAttribute('data-close')) overlay.close();
  else if (button.dataset.action) action(button.dataset.action, button);
});

const tour = createTour({dialog: q('#tour'), onOpen: () => { pauseRun(); render(); }, onClose: () => q('[data-action="tour"]')?.focus({preventScroll: true})});

document.addEventListener('visibilitychange', () => { if (document.hidden && progression.running) { pauseRun(); render(); } });

render();
if (migrated) toast('Grid Shift has new rules. Your previous shift was cleared.');

return {};
})();
</script></body></html>
